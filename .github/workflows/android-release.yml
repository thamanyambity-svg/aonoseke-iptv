name: Android — APK et AAB signés

# Construit l'APK (installation directe) et l'AAB (Play Store) de publication, signés avec VOTRE clé.
# La clé et les identifiants restent dans les « secrets » GitHub : ils ne passent jamais par le code ni par une conversation.
# Déclenchement manuel : onglet Actions → « Android — APK et AAB signés » → Run workflow.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   ANDROID_KEYSTORE_BASE64    fichier .jks encodé en base64  (base64 -w0 aonoseke.jks)
#   ANDROID_KEYSTORE_PASSWORD  mot de passe du keystore
#   ANDROID_KEY_ALIAS          alias de la clé
#   ANDROID_KEY_PASSWORD       mot de passe de la clé
#   VITE_SUPABASE_URL          adresse du projet Supabase
#   VITE_SUPABASE_ANON_KEY     clé « anon public » (publique par conception)
# Facultatif :
#   VITE_TMDB_API_KEY          clé TMDB (affiches avec titres) ; sans elle, affiches de secours
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Vérifier les secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SU: ${{ secrets.VITE_SUPABASE_URL }}
          SK: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for v in KS KSP KA KP SU SK; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants (voir l'en-tête du workflow) :$missing"
            exit 1
          fi

      - run: npm ci --no-audit --no-fund

      - name: Restaurer la clé de signature
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/aonoseke.jks"

      - name: Construire APK + AAB
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/aonoseke.jks"
          npm run android:release

      - name: Nettoyer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/aonoseke.jks"

      - name: Renommer les fichiers
        run: |
          v=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/Aonoseke-IPTV-v$v.apk"
          cp android/app/build/outputs/bundle/release/*.aab "out/Aonoseke-IPTV-PlayStore-v$v.aab"
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aonoseke-android
          path: out/
          retention-days: 14
